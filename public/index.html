<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>pi-omni</title>
<style>
  :root {
    --bg: #0f0d12;
    --fg: #f0e6f0;
    --dim: #8a8294;
    --agent: #a7f3d0;       /* pastel mint — assistant / speaking */
    --user:  #bfdbfe;       /* pastel sky — user / listening + recording */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px);
  }
  #status {
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }
  #orb {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #orb .dot {
    width: 140px; height: 140px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #333, #111 70%);
    box-shadow: 0 0 0 2px #222 inset, 0 0 40px rgba(0,0,0,0.5);
    transition: box-shadow 200ms ease-out;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #orb .glyph {
    font-size: 96px;
    line-height: 1;
  }
  /* When the orb uses CSS-glyph children (default), the glyph span is
     just a flex centerer; only one child glyph is visible at a time
     based on the orb's .glyph-* state class. */
  .orb-glyph-css .glyph {
    font-size: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease-out;
  }
  /* Scope :active to the .dot — #orb has flex:1 and would otherwise scale
     the glyph on any mouse-down across the whole page-tall area. */
  .orb-glyph-css:not(.disabled) .dot:active .glyph { transform: scale(0.9); }
  .orb-glyph-css .glyph .g { display: none; }
  .orb-glyph-css.glyph-play   .glyph .g-play   { display: block; }
  .orb-glyph-css.glyph-wave   .glyph .g-wave   { display: flex; }
  .orb-glyph-css.glyph-pause  .glyph .g-pause  { display: flex; }
  .orb-glyph-css.glyph-square .glyph .g-square { display: block; }
  /* Play: right-pointing triangle, optically centered. */
  .orb-glyph-css .glyph .g-play {
    width: 0; height: 0;
    border-style: solid;
    border-width: 40px 0 40px 64px;
    border-color: transparent transparent transparent var(--fg);
    margin-left: 16px;
    transition: border-color 200ms ease-out;
  }
  /* Waveform: five vertical bars in a symmetric meter shape. The waveform
     is the *only* glyph that's actually rendered now — the play/pause/
     square spans are kept for back-compat with the server-side orbGlyph
     override path (which strips orb-glyph-css and writes raw text). */
  .orb-glyph-css .glyph .g-wave {
    align-items: center; justify-content: center;
    gap: 8px; height: 80px;
  }
  .orb-glyph-css .glyph .g-wave i {
    display: block; width: 8px; border-radius: 4px;
    background: var(--dim);
    transition: background 200ms ease-out;
  }
  /* Active (mic open — live or PTT): light up the bars in the same blue
     used for the listening glow. Hover always toggles to the *other*
     state, so the affordance is meaningful in both directions: hovering
     an idle orb → blue (you're about to enable); hovering an active orb
     → dim (you're about to mute). Hover is scoped to .dot so the effect
     only fires inside the visible disc — #orb is flex:1 and otherwise
     would trigger from anywhere in the layout column. */
  body.mic-on .orb-glyph-css .glyph .g-wave i,
  body:not(.mic-on) #orb .dot:hover .glyph .g-wave i,
  body:not(.mic-on) #start-orb:not(.disabled) .dot:hover .glyph .g-wave i {
    background: var(--user);
  }
  body.mic-on #orb .dot:hover .glyph .g-wave i,
  body.mic-on #start-orb:not(.disabled) .dot:hover .glyph .g-wave i {
    background: var(--dim);
  }
  .orb-glyph-css .glyph .g-wave i:nth-child(1),
  .orb-glyph-css .glyph .g-wave i:nth-child(5) { height: 28px; }
  .orb-glyph-css .glyph .g-wave i:nth-child(2),
  .orb-glyph-css .glyph .g-wave i:nth-child(4) { height: 56px; }
  .orb-glyph-css .glyph .g-wave i:nth-child(3) { height: 80px; }
  /* Pause: two thick bars. */
  .orb-glyph-css .glyph .g-pause {
    align-items: center; justify-content: center;
    gap: 16px; height: 80px;
  }
  .orb-glyph-css .glyph .g-pause i {
    display: block; width: 13px; height: 80px;
    border-radius: 4px; background: var(--fg);
    transition: background 200ms ease-out;
  }
  /* Square: solid rounded square — "recording" in PTT. */
  .orb-glyph-css .glyph .g-square {
    width: 70px; height: 70px; border-radius: 10px;
    background: var(--fg);
    transition: background 200ms ease-out;
  }
  /* State is conveyed by the glow around the (always grey) orb. Listening
     is a soft neutral white — "I'm here, mic is open" — deliberately
     muted so it doesn't compete with the active states. Recording is the
     saturated user/sky blue: capturing your voice now. Speaking wears the
     pastel mint that signals "assistant talking". */
  body.listening #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 50px 2px rgba(240,240,250,0.4);
  }
  body.recording #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 6px rgba(191,219,254,0.85);
  }
  body.transcribing #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(216,180,254,0.55);
  }
  body.thinking #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(253,230,138,0.55);
  }
  body.synthesizing #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(165,243,252,0.55);
  }
  body.speaking #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(167,243,208,0.55);
  }
  body.error #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(253,164,175,0.6);
  }
  /* While the WS is down both orbs ignore input (handlers early-return on
     body.reconnecting); the dim + progress cursor signals that. */
  body.reconnecting #orb .dot,
  body.reconnecting #start-orb .dot {
    opacity: 0.45;
    cursor: progress;
    pointer-events: none;
  }
  #transcript {
    color: var(--user);
    font-size: 14px;
    text-align: center;
    min-height: 22px;
    margin-top: 12px;
    word-wrap: break-word;
    opacity: 0.9;
  }
  #assistant {
    color: var(--agent);
    font-size: 14px;
    text-align: center;
    min-height: 60px;
    margin-top: 8px;
    word-wrap: break-word;
    opacity: 0.95;
  }
  /* Pre-start disabled look on the main orb (during prefetch). */
  #orb.disabled .dot { opacity: 0.45; cursor: progress; }
  #start-hint {
    color: var(--dim); margin: 8px 0 0; max-width: 280px; text-align: center;
    font-size: 13px; align-self: center;
  }
  /* Keep layout intact when hidden — the orb is flex:1 and would
     re-center if this element collapsed. */
  #start-hint.hidden { visibility: hidden; }
</style>
</head>
<body>
  <div id="status">paused</div>
  <div id="orb" class="disabled orb-glyph-css glyph-wave"><div class="dot"><span class="glyph"><span class="g g-play"></span><span class="g g-wave"><i></i><i></i><i></i><i></i><i></i></span><span class="g g-pause"><i></i><i></i></span><span class="g g-square"></span></span></div></div>
  <div id="transcript"></div>
  <div id="assistant"></div>
  <p id="start-hint">downloading voice model…</p>
  <script src="/vendor/ort/ort.min.js"></script>
  <script src="/vendor/vad-web/bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
