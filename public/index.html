<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>pi-omni</title>
<style>
  :root {
    --bg: #0f0d12;
    --fg: #f0e6f0;
    --dim: #8a8294;
    --accent: #a7f3d0;       /* pastel mint — user / listening */
    --warn:   #fde68a;       /* pastel peach — agent thinking */
    --speak:  #bfdbfe;       /* pastel sky — assistant speaking */
    --err:    #fda4af;       /* pastel coral — errors */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px);
  }
  #status {
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }
  #orb {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #orb .dot {
    width: 140px; height: 140px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #333, #111 70%);
    box-shadow: 0 0 0 2px #222 inset, 0 0 40px rgba(0,0,0,0.5);
    transition: box-shadow 200ms ease-out;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #orb .glyph {
    font-size: 96px;
    line-height: 1;
  }
  /* When the orb uses CSS-glyph children (default), the glyph span is
     just a flex centerer; only one child glyph is visible at a time
     based on the orb's .glyph-* state class. */
  .orb-glyph-css .glyph {
    font-size: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease-out;
  }
  .orb-glyph-css:active:not(.disabled) .glyph { transform: scale(0.9); }
  .orb-glyph-css .glyph .g { display: none; }
  .orb-glyph-css.glyph-play   .glyph .g-play   { display: block; }
  .orb-glyph-css.glyph-wave   .glyph .g-wave   { display: flex; }
  .orb-glyph-css.glyph-pause  .glyph .g-pause  { display: flex; }
  .orb-glyph-css.glyph-square .glyph .g-square { display: block; }
  /* Play: right-pointing triangle, optically centered. */
  .orb-glyph-css .glyph .g-play {
    width: 0; height: 0;
    border-style: solid;
    border-width: 40px 0 40px 64px;
    border-color: transparent transparent transparent var(--fg);
    margin-left: 16px;
    transition: border-color 200ms ease-out;
  }
  /* Waveform: five vertical bars in a symmetric meter shape. */
  .orb-glyph-css .glyph .g-wave {
    align-items: center; justify-content: center;
    gap: 8px; height: 80px;
  }
  .orb-glyph-css .glyph .g-wave i {
    display: block; width: 8px; border-radius: 4px;
    background: var(--fg);
    transition: background 200ms ease-out;
  }
  .orb-glyph-css .glyph .g-wave i:nth-child(1),
  .orb-glyph-css .glyph .g-wave i:nth-child(5) { height: 28px; }
  .orb-glyph-css .glyph .g-wave i:nth-child(2),
  .orb-glyph-css .glyph .g-wave i:nth-child(4) { height: 56px; }
  .orb-glyph-css .glyph .g-wave i:nth-child(3) { height: 80px; }
  /* Pause: two thick bars. */
  .orb-glyph-css .glyph .g-pause {
    align-items: center; justify-content: center;
    gap: 16px; height: 80px;
  }
  .orb-glyph-css .glyph .g-pause i {
    display: block; width: 18px; height: 80px;
    border-radius: 4px; background: var(--fg);
    transition: background 200ms ease-out;
  }
  /* Square: solid rounded square — "recording" in PTT. */
  .orb-glyph-css .glyph .g-square {
    width: 70px; height: 70px; border-radius: 10px;
    background: var(--fg);
    transition: background 200ms ease-out;
  }
  /* State is conveyed by the glow around the (always grey) orb. */
  body.listening #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(167,243,208,0.55);
  }
  body.transcribing #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(216,180,254,0.55);
  }
  body.thinking #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(253,230,138,0.55);
  }
  body.synthesizing #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(165,243,252,0.55);
  }
  body.speaking #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(191,219,254,0.6);
  }
  body.error #orb .dot {
    box-shadow: 0 0 0 2px #222 inset, 0 0 60px 4px rgba(253,164,175,0.6);
  }
  #transcript {
    color: var(--accent);
    font-size: 14px;
    text-align: center;
    min-height: 22px;
    margin-top: 12px;
    word-wrap: break-word;
    opacity: 0.9;
  }
  #assistant {
    color: var(--speak);
    font-size: 14px;
    text-align: center;
    min-height: 60px;
    margin-top: 8px;
    word-wrap: break-word;
    opacity: 0.95;
  }
  #start-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    /* Mirror the body's column flex so #start-orb sits at the same
       vertical position as #orb behind it — no jump on overlay hide. */
    display: flex; flex-direction: column;
    z-index: 10;
    padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px);
  }
  #start-overlay.hidden { display: none; }
  /* Placeholders match the heights/margins of #status, #transcript,
     #assistant so flex:1 #start-orb-slot centers at the same Y as #orb. */
  #start-overlay .status-slot { min-height: 18px; margin-bottom: 8px; }
  #start-overlay .orb-slot {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #start-overlay .transcript-slot { min-height: 22px; margin-top: 12px; }
  #start-overlay .assistant-slot {
    min-height: 60px; margin-top: 8px;
    display: flex; flex-direction: column; align-items: center;
  }
  #start-orb {
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: opacity 120ms;
  }
  #start-orb.disabled {
    opacity: 0.45;
    cursor: progress;
  }
  /* Reuse the main orb styling so the start orb is visually identical
     (and lines up with the main orb once the overlay hides). */
  #start-orb .dot {
    width: 140px; height: 140px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #333, #111 70%);
    box-shadow: 0 0 0 2px #222 inset, 0 0 40px rgba(0,0,0,0.5);
    transition: box-shadow 200ms ease-out;
  }
  /* Hover: tint just the glyph — no box-shadow change on the disc so
     the orb stays visually still and the only feedback is the icon. */
  #start-orb:not(.disabled):hover .glyph .g-play  { border-left-color: var(--accent); }
  #orb:hover .glyph .g-wave i, #orb:hover .glyph .g-pause i,
  #start-orb:not(.disabled):hover .glyph .g-wave i,
  #start-orb:not(.disabled):hover .glyph .g-pause i { background: var(--accent); }
  #orb:hover .glyph .g-square,
  #start-orb:not(.disabled):hover .glyph .g-square { background: var(--accent); }
  #start-overlay p {
    color: var(--dim); margin: 8px 0 0; max-width: 280px; text-align: center;
    font-size: 13px;
  }
  #progress {
    width: 240px; height: 4px; border-radius: 2px;
    background: #222; overflow: hidden;
  }
  #progress .bar {
    height: 100%; width: 0; background: var(--accent);
    transition: width 120ms ease-out;
  }
  #progress.hidden { visibility: hidden; }
</style>
</head>
<body>
  <div id="start-overlay">
    <div class="status-slot"></div>
    <div class="orb-slot">
      <div id="start-orb" class="disabled orb-glyph-css glyph-pause"><div class="dot"><span class="glyph"><span class="g g-play"></span><span class="g g-wave"><i></i><i></i><i></i><i></i><i></i></span><span class="g g-pause"><i></i><i></i></span><span class="g g-square"></span></span></div></div>
    </div>
    <div class="transcript-slot"></div>
    <div class="assistant-slot">
      <div id="progress" class="hidden"><div class="bar"></div></div>
      <p id="start-hint">downloading voice model…</p>
    </div>
  </div>
  <div id="status">idle</div>
  <div id="orb" class="orb-glyph-css glyph-pause"><div class="dot"><span class="glyph"><span class="g g-play"></span><span class="g g-wave"><i></i><i></i><i></i><i></i><i></i></span><span class="g g-pause"><i></i><i></i></span><span class="g g-square"></span></span></div></div>
  <div id="transcript"></div>
  <div id="assistant"></div>
  <script src="/vendor/ort/ort.min.js"></script>
  <script src="/vendor/vad-web/bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
